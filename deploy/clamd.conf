# ClamAV daemon settings for the Hub. Mounted read only over /etc/clamav/clamd.conf in the clamav container.
#
# The Hub streams every uploaded file to clamd (the INSTREAM command on port 3310) after decrypting it in memory.
# A case file may be up to 512 MB, so the limits below are set well above that.

# Logs go to the container output (docker compose logs clamav). No log file is written.
LogTime yes
LogClean no
LogVerbose no
Foreground yes

# The app and the worker reach the scanner by name on the internal network. Nothing is published on the host.
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
User clamav

# Size limits (the defaults are far too small for 3D models).
StreamMaxLength 600M
MaxFileSize 600M
MaxScanTime 300000
MaxScanSize 1200M
MaxRecursion 16
MaxFiles 10000

# Load and timeouts.
MaxThreads 12
MaxQueue 100
ReadTimeout 300
CommandReadTimeout 60
SendBufTimeout 500
IdleTimeout 60
SelfCheck 3600

# What to scan. Archives are scanned too, even though the Hub refuses archives as case files.
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
ScanMail no

# Files that only look unusual are not an error (an unusual but harmless STL should not block a case).
AlertBrokenExecutables no
AlertEncrypted no
AlertOLE2Macros no
AlertExceedsMax no
DetectPUA no
